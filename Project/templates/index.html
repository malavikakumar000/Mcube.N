
<!DOCTYPE html>
<html>
<head>
    <title>Brightloop Software</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5fa;
            margin: 0;
            padding: 0;
        }

        header {
            background: #172554;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            flex: 1;
            min-width: 180px;
            box-shadow: 0 2px 8px #ddd;
        }

        h2 {
            color: #172554;
        }

        .number {
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
        }
    </style>
</head>

<body>

<header>
    <h1>Brightloop Software</h1>
    <p>Subscription Management System</p>
</header>

<div class="container">

    <h2>Dashboard</h2>
    <p>Welcome to your subscription management system!</p>

    <div class="cards">

        <div class="card">
            <h3>Active Subscriptions</h3>
            <p class="number">120</p>
        </div>

        <div class="card">
            <h3>Total Revenue</h3>
            <p class="number">₹50,000</p>
        </div>

        <div class="card">
            <h3>Pending Invoices</h3>
            <p class="number">15</p>
        </div>

        <div class="card">
            <h3>Total Customers</h3>
            <p class="number">85</p>
        </div>

    </div>

</div>

</body>
</html>
